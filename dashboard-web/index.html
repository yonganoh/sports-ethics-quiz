</script>
<style>
/* Layout: 소프트 스큐어모피즘 벤토. 상단 다크 알약 바 + 좌측 세로 독(5개 그룹) + 아이보리 프레임 안 벤토 카드 + 하단 모핑 알약 탭(현재 그룹의 하위 화면). 광원은 좌상단. */
:root {
  --font-body: "Plus Jakarta Sans", "Pretendard", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "Plus Jakarta Sans", "Inter", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  --canvas: #DCD6CC; --bg: #EAE5DC; --surface: #F6F4EF; --surface-2: #E3DDD3; --ink: #231F1E; --muted: #746B62; --line: #D8D1C5;
  --navy: #DCD6CC; --dock: #231F1E; --dock-ink: #F3EEE6; --dock-muted: #A69C90; --dock-bd: rgba(255, 255, 255, .12);
  --accent: #E86A38; --accent-t: #B4481B; --accent-ink: #1E1917; --pri-bg: #231F1E; --pri-ink: #F6F4EF;
  --ok: #3A8A5C; --warn: #A86F14; --bad: #C2402C; --info: #44749E;
  --bd-card: rgba(255, 255, 255, .6);
  --sh-card: inset 0 1px 1px rgba(255, 255, 255, .85), 0 10px 24px -6px rgba(35, 31, 30, .08), 0 2px 6px rgba(35, 31, 30, .04);
  --sh-well: inset 0 2px 5px rgba(35, 31, 30, .12), inset 0 -1px 1px rgba(255, 255, 255, .7);
  --sh-btn: inset 0 1px 1px rgba(255, 255, 255, .9), 0 4px 10px -3px rgba(35, 31, 30, .16), 0 1px 2px rgba(35, 31, 30, .08);
  --sh-frame: inset 0 1px 0 rgba(255, 255, 255, .8), 0 24px 48px -18px rgba(35, 31, 30, .22), 0 2px 6px rgba(35, 31, 30, .05);
  --shadow: var(--sh-card); --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
:root[data-theme="dark"] {
  --canvas: #131110; --bg: #1D1A19; --surface: #292524; --surface-2: #181514; --ink: #F1EBE2; --muted: #A59B8F; --line: #3A3431;
  --navy: #131110; --dock: #0D0B0A; --accent-t: #F29468; --pri-bg: #F1EBE2; --pri-ink: #1E1917;
  --ok: #62BD8B; --warn: #DDA545; --bad: #EE7C68; --info: #7FAEDB;
  --bd-card: rgba(255, 255, 255, .07);
  --sh-card: inset 0 1px 1px rgba(255, 255, 255, .08), 0 10px 24px -6px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --sh-well: inset 0 2px 5px rgba(0, 0, 0, .55), inset 0 -1px 1px rgba(255, 255, 255, .05);
  --sh-btn: inset 0 1px 1px rgba(255, 255, 255, .1), 0 4px 10px -3px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .4);
  --sh-frame: inset 0 1px 0 rgba(255, 255, 255, .07), 0 24px 48px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sm { font-size: 12px; }

/* shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side {
  background: var(--navy); color: var(--navy-ink); position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
  padding: 18px 12px 14px max(14px, env(safe-area-inset-left, 0px)); z-index: 40;
}
.brand { padding: 2px 8px 14px; border-bottom: 1px solid var(--navy-line); margin-bottom: 8px; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--navy-muted); }
.ngrp { font-size: 11px; letter-spacing: .08em; color: var(--navy-muted); padding: 12px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--navy-ink); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.nav:hover { background: color-mix(in srgb, #fff 8%, transparent); }
.nav[aria-current="page"] { background: color-mix(in srgb, var(--accent) 28%, transparent); color: #fff; font-weight: 700; }
.nav svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .bd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; }
.nav .bd.k { background: color-mix(in srgb, #fff 18%, transparent); }
.side .foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--navy-line); display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--navy-muted); }
.side .foot button { background: none; border: 1px solid var(--navy-line); color: var(--navy-ink); border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.topbar { display: none; }
.scrim { display: none; }
.main { min-width: 0; padding-block: 22px 72px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 18px; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; height: 100%; transform: translateX(-102%); transition: transform .18s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); box-shadow: 4px 0 24px rgba(0, 0, 0, .3); }
  .shell.open .side { transform: none; }
  .shell.open .scrim { display: block; position: fixed; inset: 0; background: rgba(5, 15, 22, .5); z-index: 30; }
  .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #fff; padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }
  .topbar button { background: none; border: 1px solid var(--navy-line); color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .topbar b { font-size: 15px; }
  .main { padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--navy); z-index: 50; }

/* page head */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.ph .crumb { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.ph h1 { font-size: 24px; letter-spacing: -.015em; line-height: 1.25; }
.ph .sub { color: var(--muted); margin-top: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dng { color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h2 { font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card > h2 a, .linkbtn { font-size: 12px; font-weight: 500; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }
.g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.big { font-family: var(--font-mono); font-size: 34px; font-weight: 500; line-height: 1.1; letter-spacing: -.02em; }
.big small { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
.empty { color: var(--muted); padding: 14px 0; font-size: 13px; }
.alert { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius: 8px; padding: 9px 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.alert.bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.alert button { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.banner { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); }

/* items & pills */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .t.done { text-decoration: line-through; color: var(--muted); }
.row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.row .go { background: none; border: 0; text-align: left; cursor: pointer; padding: 0; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 6px; white-space: nowrap; border: 1px solid var(--k, var(--line)); color: var(--k, var(--muted)); background: color-mix(in srgb, var(--k, var(--muted)) 10%, var(--surface)); }
.k-ms { --k: var(--accent); } .k-mod { --k: var(--info); } .k-iss { --k: var(--warn); } .k-ecm { --k: #8a5cc2; } .k-meet { --k: #c25c8a; } .k-todo { --k: var(--muted); } .k-ptodo { --k: #8b6fc2; } .k-pnote { --k: #c2703f; }
.pill { font-size: 12px; border-radius: 999px; padding: 1px 10px; white-space: nowrap; border: 1px solid var(--k, var(--line)); color: var(--k, var(--muted)); background: color-mix(in srgb, var(--k, var(--muted)) 11%, var(--surface)); }
.p-ok { --k: var(--ok); } .p-warn { --k: var(--warn); } .p-bad { --k: var(--bad); } .p-info { --k: var(--info); } .p-gray { --k: var(--muted); } .p-acc { --k: var(--accent); }
.dd { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; color: var(--muted); }
.dd.bad { color: var(--bad); font-weight: 700; } .dd.warn { color: var(--warn); font-weight: 700; }

/* stage meter */
.sm7 { display: inline-flex; gap: 2px; vertical-align: middle; }
.sm7 i { width: 14px; height: 7px; border-radius: 2px; background: var(--line); display: block; }
.sm7 i.d { background: var(--ok); } .sm7 i.g { background: var(--accent); } .sm7 i.n { background: transparent; border: 1px dashed var(--line); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mtile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 5px; min-width: 0; box-shadow: var(--shadow); }
.mtile:hover { border-color: var(--accent); border-left-color: var(--c, var(--accent)); }
.mtile .h { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.mtile b { font-size: 13px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mtile .f { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.st-0 { --c: var(--line); } .st-1 { --c: var(--info); } .st-2 { --c: var(--warn); } .st-3 { --c: var(--bad); } .st-4 { --c: var(--ok); }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; background: var(--surface); }
tbody tr[data-act] { cursor: pointer; }
tbody tr[data-act]:hover td { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
td.pri { font-weight: 700; min-width: 180px; overflow-wrap: anywhere; }

/* forms */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 14px; }
.fgrid .w { grid-column: 1 / -1; }
.fld label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.fld input, .fld select, .fld textarea, .in { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.fld textarea { resize: vertical; line-height: 1.6; }
.fld input:disabled, .fld select:disabled, .fld textarea:disabled { opacity: .75; }
.titlein { font-size: 22px; font-weight: 700; background: transparent; border: 0; border-bottom: 1px dashed var(--line); width: 100%; padding: 2px 0; letter-spacing: -.015em; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; font-weight: 700; }
.stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.step { border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 11%, var(--surface)); border-radius: 6px; padding: 6px 8px; text-align: left; cursor: pointer; }
.step .n { font-size: 12px; line-height: 1.3; } .step .v { font-family: var(--font-mono); font-size: 11px; color: var(--c); font-weight: 700; }
.step.todo { --c: var(--muted); } .step.doing { --c: var(--accent); } .step.done { --c: var(--ok); } .step.na { --c: var(--line); border-style: dashed; background: transparent; }
.subt { font-size: 13px; font-weight: 700; margin: 4px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kv .k { font-size: 12px; color: var(--muted); }

/* timeline */
.tl { position: relative; margin-left: 7px; padding-left: 22px; border-left: 2px solid var(--line); }
.tl-i { position: relative; padding: 6px 0 12px; cursor: pointer; }
.tl-i::before { content: ""; position: absolute; left: -29px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); border: 2px solid var(--surface); }
.tl-i.done::before { background: var(--ok); } .tl-i.plan::before { background: var(--accent); }
.tl-i.est::before { background: var(--surface); border: 2px dashed var(--muted); } .tl-i.next::before { background: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); }
.tl-i .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tl-i .tt { font-weight: 700; font-size: 14px; } .tl-i.done .tt { color: var(--muted); font-weight: 500; }
.tl-i .nn { font-size: 12.5px; color: var(--muted); }
.tl-i:hover .tt { text-decoration: underline; }

/* gantt */
.gwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.g { position: relative; --lw: 168px; --dw: 11px; }
.g-h { display: flex; height: 26px; border-bottom: 1px solid var(--line); }
.g-l { position: sticky; left: 0; z-index: 3; flex: 0 0 var(--lw); width: var(--lw); background: var(--surface); border-right: 1px solid var(--line); padding: 0 10px; font-size: 12px; color: var(--muted); display: flex; align-items: center; }
.g-t { position: relative; flex: none; }
.g-t .wk { position: absolute; top: 5px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding-left: 3px; }
.g-r { display: flex; height: 34px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.g-r .g-t { background-image: repeating-linear-gradient(to right, var(--line) 0, var(--line) 1px, transparent 1px, transparent calc(var(--dw) * 7)); }
.g-bar { position: absolute; top: 8px; height: 18px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 30%, var(--surface)); border: 1px solid var(--accent); overflow: hidden; }
.g-bar i { display: block; height: 100%; background: var(--accent); opacity: .85; }
.g-bar.ext { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 25%, var(--surface)); } .g-bar.ext i { background: var(--warn); }
.g-ms { position: absolute; top: 10px; width: 14px; height: 14px; transform: rotate(45deg); background: var(--accent); }
.g-ms.d { background: var(--ok); } .g-ms.e { background: var(--surface); border: 2px dashed var(--muted); }
.g-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--bad); z-index: 2; pointer-events: none; }
.g-lbl { position: sticky; left: 0; z-index: 3; flex: 0 0 var(--lw); width: var(--lw); background: var(--surface); border-right: 1px solid var(--line); padding: 0 10px; display: flex; align-items: center; font-size: 12.5px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* calendar */
.todo-lay { display: grid; grid-template-columns: minmax(260px, 330px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .todo-lay { grid-template-columns: minmax(0, 1fr); } }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .dw { font-size: 12px; text-align: center; color: var(--muted); padding: 6px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal .dw:first-child, .cal .c:nth-child(7n+8) { color: var(--bad); }
.cal .c { min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 4px 3px; background: var(--surface); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal .c:hover { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.cal .c.out { background: var(--bg); color: var(--muted); }
.cal .c .n { font-family: var(--font-mono); font-size: 12px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
.cal .c.today .n { background: var(--bad); color: #fff; font-weight: 700; }
.cal .e { font-size: 11px; line-height: 1.35; border-radius: 3px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: color-mix(in srgb, var(--k) 14%, var(--surface)); border-left: 3px solid var(--k); }
.cal .e.done { text-decoration: line-through; opacity: .6; }
.cal .more { font-size: 11px; color: var(--muted); padding-left: 4px; }
@media (max-width: 640px) { .cal .c { min-height: 64px; } .cal .e { height: 6px; padding: 0; font-size: 0; } }
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.cal-h h2 { font-size: 17px; }
.daygrp { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.addrow { display: flex; gap: 8px; margin: 8px 0 4px; }
.addrow input[type=text] { flex: 1; min-width: 0; }

/* refs */
.refs-lay { display: grid; grid-template-columns: minmax(230px, 290px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .refs-lay { grid-template-columns: minmax(0, 1fr); } }
.ritem { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 9px; cursor: pointer; }
.ritem:hover { background: var(--surface-2); } .ritem[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: var(--accent); }
.md h2 { font-size: 18px; margin: 4px 0 8px; } .md h3 { font-size: 15px; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md p { margin: 0 0 8px; } .md ul { margin: 0 0 8px; padding-left: 20px; } .md code { font-family: var(--font-mono); background: var(--surface-2); padding: 0 4px; border-radius: 3px; font-size: 12.5px; }

/* calculators */
.calc .res { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 8px; padding: 10px 12px; margin-top: 10px; display: grid; gap: 2px; }
.calc .res .v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.calc .fm { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }

/* meetings */
.rec { display: grid; gap: 8px; }
.rec .live { font-size: 13px; color: var(--muted); min-height: 20px; font-style: italic; }
.rec .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); margin-right: 6px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rec .dot { animation: none; } }
.mt-lay { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
@media (max-width: 980px) { .mt-lay { grid-template-columns: minmax(0, 1fr); } }
.ai-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 120px 140px auto; gap: 6px; align-items: center; margin-bottom: 6px; }
@media (max-width: 700px) { .ai-row { grid-template-columns: 22px minmax(0, 1fr) auto; } .ai-row .own, .ai-row .due { grid-column: 2 / 3; } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 80; font-size: 13px; max-width: 90vw; }
/* ---- v2: 프로젝트 운영판 ---- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; margin-top: 4px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tab:hover { color: var(--ink); }
.pcard { text-align: left; cursor: pointer; display: block; width: 100%; }
.pcard:hover { border-color: var(--accent); }
.toolbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
.sumgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .sumgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sum-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
.sum-card .k { font-size: 12px; color: var(--muted); }
.sum-card .v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; line-height: 1.2; }
